<!-- ── Login-skärm ──────────────────────── -->
<div id="login-screen" style="
  position:fixed;inset:0;z-index:9000;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  background:linear-gradient(160deg,var(--navy) 0%,var(--blue) 65%,#1E6BB8 100%);
  padding:24px;padding-bottom:env(safe-area-inset-bottom);">

  <div style="text-align:center;margin-bottom:28px;">
    <div style="background:#fff;border-radius:14px;padding:12px 24px;display:inline-block;margin-bottom:16px;">
      <span style="font-size:22px;font-weight:900;color:var(--navy);letter-spacing:-0.5px;">VIFT</span>
    </div>
    <div style="color:rgba(255,255,255,.8);font-size:13px;font-weight:600;">Fastighetsservice & Förvaltning</div>
  </div>

  <div style="width:100%;max-width:340px;background:#fff;border-radius:20px;padding:24px 20px;">
    <h2 style="font-size:18px;font-weight:800;color:var(--navy);margin-bottom:20px;text-align:center;">Logga in</h2>

    <div class="fg">
      <label>Användarnamn</label>
      <input type="text" id="login-user" placeholder="admin" autocomplete="username"
        onkeydown="if(event.key==='Enter') document.getElementById('login-pass').focus()">
    </div>
    <div class="fg" style="margin-top:8px;">
      <label>Lösenord</label>
      <input type="password" id="login-pass" placeholder="••••"
        autocomplete="current-password"
        onkeydown="if(event.key==='Enter') App.login()">
    </div>

    <div id="login-err" style="color:var(--rd);font-size:12px;font-weight:700;text-align:center;margin:6px 0;display:none;"></div>

    <button class="btn bp bfull" style="margin-top:12px;padding:12px;" onclick="App.login()">
      Logga in
    </button>

    <p style="font-size:11px;color:var(--mt);text-align:center;margin-top:12px;">
      Demo: <strong>admin</strong> / <strong>1234</strong>
    </p>
  </div>
</div>

      </button>
      <div class="topbar-title">
        <h1 id="topbar-title">Dashboard</h1>
        <p id="topbar-sub">Översikt & åtgärder</p>
      </div>
    </div>

    <!-- Scrollbart innehåll -->

      <!-- Dashboard -->

<!-- 5. App bootstrap -->
<script>
const App = {

  init() {
    // Ladda state från localStorage
    initState();

    // Försök återställa session
    const loggedIn = Auth.init();

    if (loggedIn) {
      this.showApp();
    } else {
      this.showLogin();
    }
  },

  showLogin() {
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
    // Fokusera användarnamn
    setTimeout(() => {
      const el = document.getElementById('login-user');
      if (el) el.focus();
    }, 100);
  },

  showApp() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'flex';

    // Rendera sidebar
    Sidebar.render();

    // Visa dashboard
    Router.showPage('pg-dash');
  },

  login() {
    const username = (document.getElementById('login-user').value || '').trim();
    const password = document.getElementById('login-pass').value || '';
    const errEl    = document.getElementById('login-err');

    if (!username || !password) {
      errEl.textContent = 'Fyll i användarnamn och lösenord';
      errEl.style.display = 'block';
      return;
    }

    const result = Auth.login(username, password);
    if (result.ok) {
      errEl.style.display = 'none';
      this.showApp();
    } else {
      errEl.textContent = result.error;
      errEl.style.display = 'block';
      document.getElementById('login-pass').value = '';
      document.getElementById('login-pass').focus();
    }
  }
};

// Starta appen
document.addEventListener('DOMContentLoaded', () => App.init());
</script>
