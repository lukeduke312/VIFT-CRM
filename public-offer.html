<title>Offert — VIFT Fastighetsservice</title>
<style>
/* ── Reset & tokens ─────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --navy:   #0A1628;
  --blue:   #1E5FAD;
  --sky:    #3b82f6;
  --gr:     #16a34a;
  --grn:    #22c55e;
  --or:     #f59e0b;
  --rd:     #dc2626;
  --mt:     #6b7280;
  --tx:     #111827;
  --bg:     #f8f9fa;
  --card:   #ffffff;
  --br:     #e5e7eb;
  --rs:     8px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --tx:   #f3f4f6;
    --bg:   #111827;
    --card: #1f2937;
    --br:   #374151;
    --mt:   #9ca3af;
  }
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--tx);
  line-height: 1.5;
  min-height: 100vh;
  padding: 0 0 40px;
}
a { color: var(--blue); text-decoration: none; }

/* ── Header ────────────────────────────────────────────── */
.po-header {
  background: var(--navy);
  color: #fff;
  padding: 20px 24px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  print-color-adjust: exact;
  -webkit-print-color-adjust: exact;
}
.po-logo-img { height: 44px; width: auto; max-width: 230px; object-fit: contain; display: block; }
.po-logo span { color: #60a5fa; }
.po-header-sub { font-size: 11px; opacity: .65; margin-top: 2px; }
.po-version-badge {
  background: rgba(255,255,255,.15);
  border-radius: 12px;
  font-size: 11px;
  padding: 3px 10px;
  white-space: nowrap;
}

/* ── Main layout ───────────────────────────────────────── */
.po-wrap { max-width: 800px; margin: 0 auto; padding: 20px 16px; }
.po-card {
  background: var(--card);
  border: 1px solid var(--br);
  border-radius: 12px;
  margin-bottom: 14px;
  overflow: hidden;
}
.po-card-head {
  padding: 14px 18px 12px;
  border-bottom: 1px solid var(--br);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
}
.po-card-head h2 { font-size: 14px; font-weight: 700; }
.po-card-body { padding: 16px 18px; }

/* ── Status banner ─────────────────────────────────────── */
.po-status-banner {
  border-radius: 10px;
  padding: 14px 18px;
  font-weight: 700;
  font-size: 14px;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.po-status-banner.ok      { background: #dcfce7; color: #15803d; border: 1px solid #86efac; }
.po-status-banner.warning { background: #fef3c7; color: #92400e; border: 1px solid #fcd34d; }
.po-status-banner.error   { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
.po-status-banner.info    { background: #dbeafe; color: #1e40af; border: 1px solid #93c5fd; }

/* ── Fact strip ────────────────────────────────────────── */
.po-facts {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 24px;
  padding: 12px 18px;
  border-bottom: 1px solid var(--br);
  background: rgba(0,0,0,.015);
}
.po-fact { font-size: 12px; }
.po-fact-lbl { color: var(--mt); font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .4px; display: block; margin-bottom: 1px; }
.po-fact-val { font-weight: 600; }

/* ── Line table ────────────────────────────────────────── */
.po-line-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.po-line-table th {
  text-align: left;
  padding: 7px 10px;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .4px;
  color: var(--mt);
  border-bottom: 1px solid var(--br);
  white-space: nowrap;
}
/* OFFER CORE R1 — Part C (alignment regression): th:last-child/
   td:last-child ersatta med EXPLICITA semantiska klasser. Roten till
   buggen: en `type:'text'`-rad (ren beskrivning/anteckning, t.ex.
   "Elmaterial debiteras löpande.") renderas som EN ENDA <td colspan="2">
   — den blir därmed "sista/enda td:n" i sin egen <tr> och matchade
   OAVSIKTLIGT samma :last-child-regel som prisets kolumn, vilket gjorde
   att en ren vänsterjusterad textrad blev högerjusterad, fet och med
   tabellsiffer-varianten på. Klasserna nedan är EXPLICITA om VAD cellen
   ÄR (beskrivning/anteckning vs. pris) — aldrig POSITION i raden — så en
   full-bredd anteckningsrad kan aldrig råka ärva prisets styling bara
   för att den råkar vara sista/enda cellen. */
.po-line-table th.po-th-price { text-align: right; }
.po-line-table td { padding: 9px 10px; border-bottom: 1px solid var(--br); vertical-align: top; }
.po-line-table td.po-desc  { text-align: left; }
.po-line-table td.po-price { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.po-line-table tr:last-child td { border-bottom: none; }
.po-billing-badge {
  display: inline-block; font-size: 9px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .3px; padding: 1px 6px; border-radius: 10px; margin-left: 6px; vertical-align: middle;
}
.po-billing-badge--recurring { background: #dbeafe; color: #1d4ed8; }
.po-billing-badge--rate      { background: #ffedd5; color: #c2410c; }
.po-billing-badge--option    { background: #ede9fe; color: #6d28d9; }
.po-recurring-summary { margin: 10px 0 4px; padding: 10px 12px; background: var(--bg2, #f8fafc); border-radius: 8px; }
.po-recurring-summary-row { display: flex; justify-content: space-between; font-size: 12px; padding: 2px 0; }
.po-recurring-summary-row strong { font-variant-numeric: tabular-nums; }
.po-rateopt-note { font-size: 10px; color: var(--mt); margin-top: 6px; }
.po-line-desc { font-size: 11px; color: var(--mt); margin-top: 2px; }
.po-rut-badge {
  display: inline-block;
  background: #dbeafe;
  color: #1e40af;
  font-size: 9px;
  font-weight: 700;
  padding: 1px 5px;
  border-radius: 4px;
  margin-left: 4px;
}

/* ── Totals ────────────────────────────────────────────── */
.po-totals { padding: 12px 18px; }
.po-total-row {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  padding: 4px 0;
  color: var(--mt);
}
.po-total-row.main {
  font-size: 16px;
  font-weight: 800;
  color: var(--tx);
  border-top: 2px solid var(--br);
  padding-top: 10px;
  margin-top: 6px;
}
.po-total-row span { font-variant-numeric: tabular-nums; }

/* ── Terms ────────────────────────────────────────────── */
.po-terms-text {
  font-size: 12px;
  color: var(--mt);
  line-height: 1.6;
  white-space: pre-wrap;
}

/* ── Action panel ──────────────────────────────────────── */
.po-actions {
  background: var(--card);
  border: 1px solid var(--br);
  border-radius: 12px;
  padding: 20px 18px;
  margin-bottom: 14px;
}
.po-actions h2 { font-size: 15px; font-weight: 800; margin-bottom: 6px; }
.po-actions p  { font-size: 12px; color: var(--mt); margin-bottom: 14px; }
.po-action-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.po-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 10px 18px;
  border: none;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: opacity .15s;
}
.po-btn:hover { opacity: .88; }
.po-btn.approve  { background: #16a34a; color: #fff; }
.po-btn.change   { background: #1e5fad; color: #fff; }
.po-btn.decline  { background: #fff; color: var(--rd); border: 1px solid var(--rd); }
.po-btn.submit   { background: var(--blue); color: #fff; }
.po-btn.cancel   { background: var(--bg); color: var(--mt); border: 1px solid var(--br); }
.po-btn:disabled { opacity: .4; cursor: not-allowed; }

/* ── Form ─────────────────────────────────────────────── */
.po-form { display: flex; flex-direction: column; gap: 12px; margin-top: 14px; }
.po-fg label { display: block; font-size: 11px; font-weight: 700; color: var(--mt); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .3px; }
.po-fg input, .po-fg textarea, .po-fg select {
  width: 100%;
  padding: 8px 10px;
  border: 1px solid var(--br);
  border-radius: 7px;
  font-size: 13px;
  background: var(--bg);
  color: var(--tx);
  font-family: inherit;
}
.po-fg textarea { resize: vertical; }
.po-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 480px) { .po-row2 { grid-template-columns: 1fr; } }
.po-checkbox-row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  background: #f0fdf4;
  border: 1px solid #86efac;
  border-radius: 8px;
  padding: 12px;
  cursor: pointer;
}
.po-checkbox-row input[type=checkbox] { width: 16px; height: 16px; flex-shrink: 0; margin-top: 1px; }
.po-checkbox-row span { font-size: 12px; color: #15803d; font-weight: 600; line-height: 1.4; }
.po-error { color: var(--rd); font-size: 12px; font-weight: 600; display: none; margin-top: 4px; }
.po-error.show { display: block; }
.po-success-box {
  background: #dcfce7;
  border: 1px solid #86efac;
  border-radius: 10px;
  padding: 18px 20px;
  text-align: center;
}
.po-success-box h3 { color: #15803d; font-size: 16px; margin-bottom: 6px; }
.po-success-box p  { color: #166534; font-size: 13px; }

/* ── Bilagor ─────────────────────────────────────────── */
.po-att-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid var(--br);
}
.po-att-row:last-child { border-bottom: none; }
.po-att-icon { flex-shrink: 0; color: var(--mt); }
.po-att-info { flex: 1; min-width: 0; }
.po-att-name {
  font-size: 13px;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.po-att-meta { font-size: 11px; color: var(--mt); margin-top: 2px; }
.po-att-actions { display: flex; gap: 6px; flex-shrink: 0; }
.po-att-btn {
  padding: 5px 11px;
  border: 1px solid var(--br);
  border-radius: 6px;
  background: var(--card);
  color: var(--tx);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  font-family: inherit;
}
.po-att-btn:hover { background: var(--bg); }
@media (max-width: 480px) {
  .po-att-row { flex-wrap: wrap; }
  .po-att-actions { flex: 1 1 100%; }
}

/* ── Print ────────────────────────────────────────────── */
.po-print-btn {
  background: none;
  border: 1px solid var(--br);
  border-radius: 6px;
  color: var(--mt);
  font-size: 11px;
  padding: 5px 10px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
@media print {
  .po-actions, .po-print-btn, .po-action-btns, #po-dl-pdf-btn { display: none !important; }
  .po-header { background: #0A1628 !important; }
  body { background: #fff; }
}

/* ── Loader ───────────────────────────────────────────── */
.po-loader {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 60vh;
  gap: 14px;
  color: var(--mt);
  font-size: 14px;
}
.po-spinner {
  width: 36px; height: 36px;
  border: 3px solid var(--br);
  border-top-color: var(--blue);
  border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

<body>

<!-- Header -->
<div class="po-header">
  <div>

    <button class="po-print-btn" onclick="window.print()">🖨 Skriv ut</button>
  </div>
</div>

<!-- Main content injected here -->
<div class="po-wrap" id="po-root">
  <div class="po-loader">
    <div class="po-spinner"></div>
    <span>Hämtar offert…</span>
  </div>
</div>

<script src="src/shared/OfferCalc.js?v=1"></script>
<script>
/* ── Konfig ─────────────────────────────────────────────── */
/* SUPABASE_URL injiceras från window.VIFT_CONFIG om tillgängligt,
   annars hårdkodas (samma som storage.js) */
var SUPABASE_URL = (typeof window !== 'undefined' && window.VIFT_CONFIG && window.VIFT_CONFIG.supabaseUrl)
  ? window.VIFT_CONFIG.supabaseUrl
  : 'https://hjplzjsbbowiyoyhdghc.supabase.co';

/* ── State ──────────────────────────────────────────────── */
var _offer       = null;
var _token       = null;
var _attachments = [];
var _activeForm  = null; /* approve | change_request | decline */

/* ── Hjälpfunktioner ────────────────────────────────────── */
function fmt(n) { return new Intl.NumberFormat('sv-SE').format(Math.round(n||0)); }
function fmtD(d) {
  if (!d) return '—';
  var s = d.slice(0,10);
  try { return new Date(s + 'T12:00:00').toLocaleDateString('sv-SE', {year:'numeric',month:'long',day:'numeric'}); } catch(e) { return s; }
}
function esc(s) {
  return String(s||'')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

/* ── Token från URL eller fragment ─────────────────────────
   Prioritetsordning:
   1. URL search param ?t=... (befintliga skickade länkar)
      → Flytta omedelbart till fragment #t=... via replaceState
        (fragment skickas inte till servern i HTTP-anrop och
         syns inte i access-loggar eller Referer-headers).
   2. Fragment #t=... (redan flytt + sidor som länkats med #t=)
      → Läses direkt; fragmentet bevaras vid sidoändatering.
   Sidupp­datering fungerar alltid eftersom #t=... finns kvar
   i adressfältet. */
function getToken() {
  // Försök URL-parametrar (äldre offertlänkar)
  var params = new URLSearchParams(window.location.search);
  var t = (params.get('t') || '').trim();
  if (t) return t;

  // Försök fragment (redan flytt eller ny länkformat)
  var hash = window.location.hash;
  if (hash && hash.startsWith('#t=')) {
    return decodeURIComponent(hash.slice(3)).trim();
  }
  return '';
}

/* ── Hämta offert via Edge Function ─────────────────────── */
async function loadOffer(token) {
  var root = document.getElementById('po-root');
  try {
    var res = await fetch(SUPABASE_URL + '/functions/v1/offer-token-validate?t=' + encodeURIComponent(token));
    var data = await res.json();

    if (!res.ok) {
      var msg = data.error === 'expired'   ? 'Offertlänken har gått ut.'
              : data.error === 'revoked'   ? 'Offertlänken har återkallats.'
              : data.error === 'not_found' ? 'Offerten hittades inte. Kontrollera att länken är korrekt.'
              : 'Kunde inte hämta offerten. Försök igen senare.';
      root.innerHTML = '<div class="po-status-banner error">⚠ ' + esc(msg) + '</div>';
      return;
    }

    _offer       = data.offer;
    _attachments = Array.isArray(data.attachments) ? data.attachments : [];
    renderOffer(_offer);
  } catch(e) {
    root.innerHTML = '<div class="po-status-banner error">⚠ Nätverksfel — kontrollera din internetanslutning och försök igen.</div>';
  }
}

/* V38 §5: kanonisk 0-safe momsnormalisering — samma semantik som
   InvoiceService.normalizeVatRate/PageShells._normVat (V35-V38).
   null/undefined/tomsträng (inkl. whitespace-only) = inget värde satt ->
   fallback 25; explicit 0/'0' = 0 % (behålls exakt); giltigt 0-100
   behålls exakt; NaN/Infinity/negativt/>100 -> fallback. */
function _poNormVat(value, fallback) { return OfferCalc.normVat(value, fallback); }

/* V48B5 R1 (blocker-korrigering): kanoniska sektions-ID:n — EXAKT samma
   fyra block som PageShells.OFFER_SECTION_IDS (duplicerad här av samma
   skäl som _poNormVat ovan, ingen delad modulkedja finns mellan detta
   fristående-HTML-dokument och src/). B5 har aldrig gått live, så det
   finns ingen gammal produktionsordning att bevara — en offert utan
   sparad off.sectionOrder faller tillbaka på PO_DEFAULT_ORDER, som är
   samma fyra-block-standard som övriga ytor. */
var PO_SECTION_IDS = ['description', 'pricing', 'commercialTerms', 'generalTerms'];
var PO_DEFAULT_ORDER = PO_SECTION_IDS.slice();
function _poResolveSectionOrder(order) {
  if (!Array.isArray(order) || !order.length) return PO_DEFAULT_ORDER.slice();
  var seen = {};
  var out = [];
  order.forEach(function(id) {
    if (typeof id === 'string' && PO_SECTION_IDS.indexOf(id) !== -1 && !seen[id]) {
      seen[id] = true; out.push(id);
    }
  });
  PO_DEFAULT_ORDER.forEach(function(id) { if (!seen[id]) { seen[id] = true; out.push(id); } });
  return out;
}

/* OFFER CORE R1 — samma kanoniska dispatch som _lineExVat() i
   PageShells.js (kan inte dela JS-kod med detta fristående dokument,
   se filhuvudkommentaren för _poNormVat, men implementerar SAMMA
   formel/semantik). 'rate'/'option' returnerar alltid 0 — se
   RAPPORT §Prismodell. */
function _poLineExVat(l) { return OfferCalc.lineExVat(l); }

/* OFFER CORE R1 — badge/prisetikett för billingType, mirror av
   OffersPage._billingTypeBadgeHtml/_billingPriceLabelHtml i
   PageShells.js. Denna fil kan inte dela JS-moduler med appen (fristående
   statisk sida), så samma formler återimplementeras medvetet här.
   OFFER CORE R1.1 — BLOCKER 1: 'option' borttaget (se PageShells.js —
   VIFT:s kanoniska tillvalsmodell är off.extras[], inte en andra
   radnivå-modell). */
function _poBillingBadgeHtml(l) {
  var bt = l.billingType || 'onetime';
  if (bt === 'recurring') return '<span class="po-billing-badge po-billing-badge--recurring">Återkommande/mån</span>';
  if (bt === 'rate')      return '<span class="po-billing-badge po-billing-badge--rate">Rörligt à-pris</span>';
  return '';
}

/* OFFER CORE R1.1 — BLOCKER 6 (motbevis-granskad): R1 visade rate/
   recurring-priser med det momsberäknade beloppet SOM PRIMÄRT (t.ex.
   "440 kr/h" blev "550 kr/h", "8 000 kr/mån" blev "10 000 kr/mån") —
   men det verkliga, av VIFT OFFERERADE och kontrakterade priset för
   dessa rader är ALLTID exkl. moms (Södra Heden-referensen anger
   uttryckligen "440 kr/timme exkl. moms" osv). Det momsberäknade
   beloppet är korrekt SEKUNDÄR/kompletterande information, men får
   ALDRIG tyst ersätta det citerade ex-moms-priset som primärt värde.
   `amountExVat`/`amountIncVat`: radens/räntans båda belopp — inkl.-
   moms visas nu ALLTID som en tydligt märkt sekundärrad, aldrig som
   ersättning för ex-moms-talet. */
function _poBillingPriceLabelHtml(l, amountExVat, amountIncVat) {
  var bt = l.billingType || 'onetime';
  var unit = (l.unit || '').trim();
  if (bt === 'recurring') {
    var sufR = unit ? '/' + esc(unit) : '/mån';
    return fmt(amountExVat) + ' kr' + sufR + ' exkl. moms<div class="po-line-desc">' + fmt(amountIncVat) + ' kr' + sufR + ' inkl. moms</div>';
  }
  if (bt === 'rate') {
    var rateEx = +(l.unitPrice || 0);
    var rateInc = Math.round(rateEx * (1 + _poNormVat(l.vatRate) / 100));
    var sufH = unit ? '/' + esc(unit) : '';
    return fmt(rateEx) + ' kr' + sufH + ' exkl. moms<div class="po-line-desc">' + fmt(rateInc) + ' kr' + sufH + ' inkl. moms</div>';
  }
  return fmt(amountIncVat) + ' kr';
}

/* OFFER CORE R1.1 — BLOCKER 1: mirror av _extraIncludedInTotal() i
   PageShells.js. e.includedInTotal===false = explicit ej committad
   tillval-extra; frånvarande fält (all historisk data) = "included",
   exakt samma summa som innan R1.1. */
function _poExtraIncludedInTotal(e) { return OfferCalc.extraIncludedInTotal(e); }

/* OFFER CORE R1.2 — RUT/ROT rendering hardening (defense in depth,
   mirror of _effectiveRutAmount() in PageShells.js). A recurring/rate
   row must never show a RUT/ROT badge or a discounted "kundpris efter
   avdrag" merely because malformed/stale data carries a leftover
   rutAmount. */
function _poEffectiveRutAmount(l) {
  return (l.billingType || 'onetime') === 'onetime' ? (l.rutAmount || 0) : 0;
}

/* ── Render offert ──────────────────────────────────────── */
function renderOffer(off) {
  var root = document.getElementById('po-root');

  /* Versionbadge i header */
  var vb = document.getElementById('po-ver-badge');
  if (vb) vb.textContent = off.title || ('Offert ' + off.id);

  /* Beräkna summor */
  var lines    = Array.isArray(off.lines)  ? off.lines  : [];
  var extras   = Array.isArray(off.extras) ? off.extras : [];
  /* OFFER CORE R1: 'recurring'/'rate'/'option'-rader exkluderade ur den
     klassiska engångs-totalsumman — se _offRawExVat() i PageShells.js
     för fullständig motivering (aldrig blanda kr/mån med ett
     engångsbelopp, aldrig räkna ett rörligt à-pris som ett köpt fast
     belopp). */
  var prLines  = lines.filter(function(l) { return l.type !== 'text' && l.billingType !== 'recurring' && l.billingType !== 'rate'; });
  var recurringLines = lines.filter(function(l) { return l.billingType === 'recurring'; });
  var rateOptLines   = lines.filter(function(l) { return l.billingType === 'rate'; });

  /* Summor från samma OfferCalc som CRM:et (src/shared/OfferCalc.js) —
     kunden ska aldrig se en annan totalsumma än den som sparats/fakturerats.
     Tidigare egen kopia gav avvikelser, bl.a. för äldre rader med `price`
     i stället för `unitPrice` (se tests/browser/offer_total_parity.js). */
  var _t = OfferCalc.totals(off);
  var rawEx   = _t.rawExVat;
  var discAmt = _t.discountAmount;
  var exVat   = _t.exVatAfterDiscount;
  var vat     = _t.vatAmount;
  var incVat  = _t.totalInclVat;
  var rutAmt  = _t.rutRotAmount;
  var cust    = _t.customerPays;
  var recurringMonthlyEx  = _t.recurringMonthlyExVat;
  var recurringMonthlyVat = _t.recurringMonthlyVat;
  var recurringMonthlyInc = _t.recurringMonthlyInclVat;
  var recurringAnnualEx   = _t.recurringAnnualExVat;
  var recurringAnnualInc  = _t.recurringAnnualInclVat;

  /* Statusbanner */
  var answered = off.status === 'godkänd' || off.status === 'nekad' || off.status === 'ändring-begärd';
  var statusBanner = '';
  if (off.status === 'godkänd') {
    statusBanner = '<div class="po-status-banner ok">✓ Offerten är godkänd</div>';
  } else if (off.status === 'nekad') {
    statusBanner = '<div class="po-status-banner error">✕ Offerten har nekats</div>';
  } else if (off.status === 'ändring-begärd') {
    statusBanner = '<div class="po-status-banner warning">↩ Ändring har begärts — VIFT återkommer med reviderat förslag</div>';
  }

  /* Validitetspåminnelse */
  var expiryNote = '';
  if (off.tokenExpiresAt) {
    var exp    = new Date(off.tokenExpiresAt).getTime();
    var daysL  = Math.ceil((exp - Date.now()) / 86400000);
    if (daysL <= 7 && daysL > 0) {
      expiryNote = '<div class="po-status-banner warning">⏰ Offerten utgår om ' + daysL + ' dag' + (daysL===1?'':'ar') + ' (' + fmtD(off.tokenExpiresAt) + ').</div>';
    }
  }

  /* Faktarader — V48B5 R1: paymentTerms/validityText FLYTTAT ut härifrån
     till ett eget flyttbart "commercialTerms"-block (se längre ner) —
     bara fast metadata (kund/fastighet/datum/giltig-till) kvar här. */
  var factsHtml = '';
  var facts = [];
  if (off.customerName) facts.push({l:'Kund', v: off.customerName});
  if (off.address)      facts.push({l:'Fastighet', v: off.address});
  if (off.date)         facts.push({l:'Datum', v: fmtD(off.date)});
  if (off.validUntil)   facts.push({l:'Giltig till', v: fmtD(off.validUntil)});
  if (facts.length) {
    factsHtml = '<div class="po-facts">' + facts.map(function(f) {
      return '<div class="po-fact"><span class="po-fact-lbl">' + esc(f.l) + '</span><span class="po-fact-val">' + esc(f.v) + '</span></div>';
    }).join('') + '</div>';
  }

  /* Offertposter — V48B5 R4 §5: raderna (inkl. textblock) MÅSTE fysiskt
     återges i EXAKT off.lines-arrayordning. Itererar hela `lines`
     (inte den type-filtrerade `prLines`) och bygger en textrad med
     colspan="2" på sin exakta position i SAMMA tabell. Text-rader
     visar nu även blockTitle (tidigare tappades den helt här). */
  var linesHtml = '';
  if (lines.length) {
    var rows = lines.map(function(l) {
      if (l.type === 'text') {
        if (!l.blockTitle && !l.text) return '';
        var titleHtml = l.blockTitle ? '<strong>' + esc(l.blockTitle) + '</strong>' : '';
        var textHtml  = l.text ? (l.blockTitle ? '<br>' : '') + '<span style="white-space:pre-wrap;">' + esc(l.text) + '</span>' : '';
        return '<tr><td colspan="2" class="po-desc" style="padding:10px 0;border-bottom:1px solid var(--br);font-size:13px;line-height:1.6;">' + titleHtml + textHtml + '</td></tr>';
      }
      if (l.type === 'service') {
        var lEx  = l.exVat || 0;
        var lVat = Math.round(lEx*_poNormVat(l.vatRate)/100);
        var lInc = lEx + lVat;
        var lRut = l.rutAmount || 0;
        var lCust2 = lInc - lRut;
        return '<tr><td class="po-desc">' + esc(l.templateName||'Tjänst') +
          (lRut ? '<span class="po-rut-badge">RUT/ROT</span>' : '') +
          (l.description ? '<div class="po-line-desc">' + esc(l.description) + '</div>' : '') +
          '</td><td class="po-price">' + (lRut ? fmt(lCust2) + ' kr<div class="po-line-desc">inkl. moms efter avdrag</div>' : fmt(lInc) + ' kr') + '</td></tr>';
      }
      /* Manuell/fastprisrad — V49 OFFER-CORE-R1: `_poLineExVat(l)` ersätter
         den tidigare `l.total || Math.round(...)`-formeln, som felaktigt
         läste om ett äkta, sparat `total:0` (rate-rader) som "ej satt"
         och räknade fram ett nytt, felaktigt belopp. billingType styr nu
         även prisetiketten: rate visar radens rena à-pris (aldrig
         inräknat i någon totalsumma), recurring visar "/mån"-suffix
         (eller egen enhet), onetime är oförändrat.
         OFFER CORE R1.1 — BLOCKER 1: 'option' borttaget. BLOCKER 6:
         _poBillingPriceLabelHtml tar nu BÅDA ex./inkl.-moms-beloppen —
         ex. moms visas primärt för rate/recurring (se funktionen). */
      var bt3 = l.billingType || 'onetime';
      var tot    = _poLineExVat(l);
      var totInc = tot + Math.round(tot * _poNormVat(l.vatRate) / 100);
      var lRut2   = _poEffectiveRutAmount(l);
      var lCust3  = totInc - lRut2;
      var priceHtml3 = (bt3 === 'rate')
        ? _poBillingPriceLabelHtml(l, 0, 0)
        : (lRut2 ? fmt(lCust3) + ' kr<div class="po-line-desc">inkl. moms efter avdrag</div>' : _poBillingPriceLabelHtml(l, tot, totInc));
      var qtyDescHtml3 = (bt3 === 'rate') ? '' :
        (l.qty && l.unit ? '<div class="po-line-desc">' + l.qty + ' ' + esc(l.unit) + ' × ' + fmt(l.unitPrice||0) + ' kr</div>' : '');
      return '<tr><td class="po-desc">' + esc(l.description||l.templateName||'Rad') + ' ' + _poBillingBadgeHtml(l) +
        (lRut2 ? '<span class="po-rut-badge">' + (l.reductionType==='rot'?'ROT':'RUT') + '</span>' : '') +
        qtyDescHtml3 +
        '</td><td class="po-price">' + priceHtml3 + '</td></tr>';
    }).join('');
    /* OFFER CORE R1.1 — BLOCKER 6: kolumnrubriken generaliserad från
       "Pris inkl. moms" till "Pris" eftersom rate/recurring-rader nu
       visar sitt ex-moms-pris PRIMÄRT (se _poBillingPriceLabelHtml) —
       en rubrik som påstod "inkl. moms" för HELA kolumnen skulle
       motsäga dessa rader. Onetime/service-raderna visar fortfarande
       sitt inkl.-moms-belopp som förut, oförändrat. */
    linesHtml = '<div style="overflow-x:auto;"><table class="po-line-table"><thead><tr><th>Beskrivning</th><th class="po-th-price">Pris</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  }

  /* Tilläggsrader — OFFER CORE R1.1 — BLOCKER 1: en extra med
     e.includedInTotal===false är EXPLICIT ej committad (visas separat
     nedan i rateOptSummaryHtml tillsammans med rate-raderna, inte här).
     Frånvarande fält (all historisk data) = "included", oförändrat
     beteende/utseende jämfört med innan R1.1. */
  var committedExtras = extras.filter(_poExtraIncludedInTotal);
  var optionalExtras   = extras.filter(function(e) { return !_poExtraIncludedInTotal(e); });
  var extrasHtml = '';
  if (committedExtras.length) {
    extrasHtml = '<div style="margin-top:8px;"><div style="font-size:10px;font-weight:700;color:var(--mt);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px;">Tillägg</div>' +
      committedExtras.map(function(e) {
        var tot = Math.round((e.qty||1)*(e.unitPrice||0));
        var eRate = _poNormVat(e.vatRate);
        return '<div style="display:flex;justify-content:space-between;font-size:12px;padding:4px 0;border-bottom:1px solid var(--br);">' +
          '<span>' + esc(e.description||'') + (e.qty&&e.unit ? ' (' + e.qty + ' ' + esc(e.unit) + ')' : '') + '</span>' +
          '<span style="font-weight:600;font-variant-numeric:tabular-nums;">' + fmt(tot+Math.round(tot*eRate/100)) + ' kr</span></div>';
      }).join('') + '</div>';
  }

  /* OFFER CORE R1 — additiv, tydligt separerad återkommande-summering.
     Visas ENDAST när offerten faktiskt har återkommande rader (annars
     helt tom sträng — inga befintliga, äldre offerter påverkas eftersom
     recurringLines då alltid är []). Renderas ALDRIG ihop med den
     klassiska engångstotalsumman (samma additiva princip som
     OffersPage._totalsBarHtml() i PageShells.js).
     OFFER CORE R1.1 — BLOCKER 6: ex.-moms-beloppet är PRIMÄRT (det
     citerade kontraktsvärdet, t.ex. "8 000 kr/mån exkl. moms" för Södra
     Heden) — inkl.-moms visas som tydligt märkt sekundär information,
     ALDRIG som ersättning för det primära ex-moms-talet. */
  var recurringSummaryHtml = recurringLines.length ? (
    '<div class="po-recurring-summary">' +
      '<div class="po-recurring-summary-row"><span>Fast kostnad per månad</span><strong>' + fmt(recurringMonthlyEx) + ' kr exkl. moms</strong></div>' +
      '<div class="po-recurring-summary-row" style="opacity:.7;font-size:11px;"><span></span><span>' + fmt(recurringMonthlyInc) + ' kr/mån inkl. moms</span></div>' +
      '<div class="po-recurring-summary-row"><span>Fast kostnad per år (härledd)</span><strong>' + fmt(recurringAnnualEx) + ' kr exkl. moms</strong></div>' +
      '<div class="po-recurring-summary-row" style="opacity:.7;font-size:11px;"><span></span><span>' + fmt(recurringAnnualInc) + ' kr/år inkl. moms</span></div>' +
    '</div>'
  ) : '';

  /* Rörliga à-priser + explicit ej committade tillval-extras — visas
     tydligt tillsammans, men ingår ALDRIG i någon totalsumma ovan (se
     _poLineExVat för rate-rader, _poExtraIncludedInTotal för extras). */
  var rateOptSummaryHtml = (rateOptLines.length || optionalExtras.length) ? (
    '<div class="po-rateopt-note">' +
      '<div style="font-size:10px;font-weight:700;color:var(--mt);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px;">Rörliga à-priser / tillval (ingår ej i summan ovan)</div>' +
      rateOptLines.map(function(l) {
        return '<div style="display:flex;justify-content:space-between;font-size:12px;padding:4px 0;">' +
          '<span>' + esc(l.description||'Rörligt pris') + ' ' + _poBillingBadgeHtml(l) + '</span>' +
          '<span style="font-weight:600;font-variant-numeric:tabular-nums;">' + _poBillingPriceLabelHtml(l, 0, 0) + '</span></div>';
      }).join('') +
      optionalExtras.map(function(e) {
        var eTot = Math.round((e.qty||1)*(e.unitPrice||0));
        return '<div style="display:flex;justify-content:space-between;font-size:12px;padding:4px 0;">' +
          '<span>' + esc(e.description||'Tillval') + '</span>' +
          '<span style="font-weight:600;font-variant-numeric:tabular-nums;">' + fmt(eTot) + ' kr' + (e.unit?'/'+esc(e.unit):'') + ' exkl. moms</span></div>';
      }).join('') +
    '</div>'
  ) : '';

  /* Summering — V49 OFFER-CORE-R1: när offerten har en återkommande
     (kr/mån) del, förtydligas etiketterna till "Engångsbelopp" så att
     kunden aldrig kan tro att detta ensamt är "allt" — den återkommande
     delen visas separat i recurringSummaryHtml ovan/nedan, aldrig
     hopslagen med denna klassiska engångstotalsumma (samma princip som
     OffersPage._totalsBarHtml() i PageShells.js). */
  var totalLabelPrefix = recurringLines.length ? 'Engångsbelopp' : 'Totalt';
  var totalsHtml = '<div class="po-totals">' +
    (discAmt ? '<div class="po-total-row"><span>Delsumma</span><span>' + fmt(rawEx) + ' kr</span></div>' : '') +
    (discAmt ? '<div class="po-total-row"><span>Rabatt</span><span>−' + fmt(discAmt) + ' kr</span></div>' : '') +
    '<div class="po-total-row"><span>' + totalLabelPrefix + ' exkl. moms</span><span>' + fmt(exVat) + ' kr</span></div>' +
    '<div class="po-total-row"><span>Moms</span><span>' + fmt(vat) + ' kr</span></div>' +
    (rutAmt ? '<div class="po-total-row"><span>RUT/ROT-avdrag</span><span>−' + fmt(rutAmt) + ' kr</span></div>' : '') +
    '<div class="po-total-row main"><span>' + (recurringLines.length ? 'Engångsbelopp att betala' : 'Totalt att betala') + '</span><span>' + fmt(rutAmt ? cust : incVat) + ' kr</span></div>' +
    (rutAmt ? '<div style="font-size:10px;color:var(--mt);margin-top:6px;">Totalt inkl. moms: ' + fmt(incVat) + ' kr — RUT/ROT-avdrag: −' + fmt(rutAmt) + ' kr = Kundpris: ' + fmt(cust) + ' kr</div>' : '') +
    '</div>';

  /* Aktionspanel */
  var actionsHtml = '';
  if (!answered) {
    actionsHtml = '<div class="po-actions" id="po-actions">' +
      '<h2>Vad vill du göra?</h2>' +
      '<p>Du kan godkänna offerten, begära ändringar eller meddela att du inte vill gå vidare.</p>' +
      '<div class="po-action-btns" id="po-action-btns">' +
        '<button class="po-btn approve" onclick="showForm(\'approve\')">✓ Godkänn offert</button>' +
        '<button class="po-btn change"  onclick="showForm(\'change_request\')">↩ Begär ändring</button>' +
        '<button class="po-btn decline" onclick="showForm(\'decline\')">✕ Neka offert</button>' +
      '</div>' +
      '<div id="po-form-area"></div>' +
    '</div>';
  }

  /* V48B5 R1/R2: EXAKT FYRA fysiskt flyttbara block — description/
     pricing/commercialTerms/generalTerms — samma modell som
     CRM-detaljvyn/printPdf() (PageShells.js). "pricing" omfattar ENDAST
     prisrelaterat innehåll (rader/tillägg/textblock/totaler) — titel/
     version/ID/fakta är FAST dokumentmetadata (R2 §3-korrigering, se
     metaHtml nedan), inte en del av pricing. "description" slår ihop
     sammanfattning + omfattning + ingår/ingår ej till ETT kort.
     "commercialTerms" (betalning/giltighetstid) är ett eget riktigt
     flyttbart block, INTE fast i facts-raden. B5 har aldrig gått
     live -> ingen legacy-position att bevara, se _poResolveSectionOrder. */
  var descFields = [];
  if (off.summary)  descFields.push({l:'Sammanfattning', v:off.summary});
  if (off.scope)     descFields.push({l:'Omfattning', v:off.scope});
  if (off.includes) descFields.push({l:'Ingår', v:off.includes});
  if (off.excludes) descFields.push({l:'Ingår ej', v:off.excludes});
  if (off.terms)     descFields.push({l:'Villkor', v:off.terms});
  var descriptionHtml = '';
  if (descFields.length) {
    descriptionHtml = '<div class="po-card"><div class="po-card-head"><h2>Uppdragsbeskrivning</h2></div><div class="po-card-body" style="display:flex;flex-direction:column;gap:14px;">' +
      descFields.map(function(f) {
        return '<div><div style="font-size:10px;font-weight:700;color:var(--mt);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px;">' + esc(f.l) + '</div>' +
          '<p class="po-terms-text">' + esc(f.v) + '</p></div>';
      }).join('') + '</div></div>';
  }

  var generalTermsHtml = off.generalTerms ?
    '<div class="po-card"><div class="po-card-head"><h2>Allmänna villkor</h2></div><div class="po-card-body"><p class="po-terms-text">' + esc(off.generalTerms) + '</p></div></div>' : '';

  var commercialTermsHtml = '';
  if (off.paymentTerms || off.validityText) {
    commercialTermsHtml = '<div class="po-card"><div class="po-card-head"><h2>Offertvillkor</h2></div><div class="po-card-body" style="display:flex;flex-direction:column;gap:14px;">' +
      (off.paymentTerms ? '<div><div style="font-size:10px;font-weight:700;color:var(--mt);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px;">Betalningsvillkor</div><p class="po-terms-text">' + esc(off.paymentTerms) + '</p></div>' : '') +
      (off.validityText ? '<div><div style="font-size:10px;font-weight:700;color:var(--mt);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px;">Giltighetstid</div><p class="po-terms-text">' + esc(off.validityText) + '</p></div>' : '') +
      '</div></div>';
  }

  /* V48B5 R2 §3: offertens IDENTITET (titel/version/ID) + fasta fakta
     (kund/fastighet/datum/giltig-till) är DOKUMENTMETADATA, inte
     "pricing" — låg tidigare felaktigt inne i det flyttbara
     pricing-kortet, vilket gjorde att offertens rubrik/identitet
     försvann från toppen av sidan om användaren flyttade pricing
     längre ner. Nu ett eget FAST kort, alltid överst, före de fyra
     flyttbara blocken. */
  var metaHtml = '<div class="po-card">' +
      '<div class="po-card-head">' +
        '<h2>' + esc(off.title || ('Offert ' + off.id)) + '</h2>' +
        '<span style="font-size:11px;color:var(--mt);">Version ' + (off.versionNumber||1) + ' · ' + esc(off.id) + '</span>' +
      '</div>' +
      factsHtml +
    '</div>';

  /* V48B5 R4: textblocken ritas nu INLINE i linesHtml (ovan), på sin
     exakta position i off.lines — inte längre samlade separat före
     prisraderna. */
  var pricingHtml = (linesHtml||extrasHtml||totalsHtml) ? '<div class="po-card">' +
      (linesHtml||extrasHtml ? '<div class="po-card-body" style="padding:0;">' + linesHtml + (extrasHtml?'<div style="padding:12px 18px;">'+extrasHtml+'</div>':'') + '</div>' : '') +
      (recurringSummaryHtml || rateOptSummaryHtml ? '<div style="padding:12px 18px;">' + recurringSummaryHtml + rateOptSummaryHtml + '</div>' : '') +
      totalsHtml +
    '</div>' : '';

  var renderers = {
    description: descriptionHtml,
    pricing: pricingHtml,
    commercialTerms: commercialTermsHtml,
    generalTerms: generalTermsHtml
  };
  var orderedSectionsHtml = _poResolveSectionOrder(off.sectionOrder).map(function(id) { return renderers[id] || ''; }).join('');

  root.innerHTML =
    statusBanner +
    expiryNote +
    metaHtml +
    orderedSectionsHtml +
    renderAttachments() +
    actionsHtml +
    '<div style="text-align:center;padding:20px 0;font-size:11px;color:var(--mt);">VIFT Fastighetsservice · Frågor? Kontakta din förvaltare.</div>';
}

/* ── Bilagor ─────────────────────────────────────────────── */
function _poFileIcon(mime) {
  var m = (mime||'').toLowerCase();
  var color = m.indexOf('pdf') >= 0    ? '#dc2626'
            : m.indexOf('image') >= 0  ? '#7c3aed'
            : m.indexOf('word') >= 0 || m.indexOf('document') >= 0 ? '#2563eb'
            : m.indexOf('sheet') >= 0 || m.indexOf('excel') >= 0 || m.indexOf('csv') >= 0 ? '#16a34a'
            : '#6b7280';
  return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="' + color + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
    '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>' +
    '<polyline points="14 2 14 8 20 8"/></svg>';
}

function renderAttachments() {
  if (!_attachments || _attachments.length === 0) return '';
  var rows = _attachments.map(function(a) {
    var sizeLbl = a.sizeBytes > 1048576
      ? (a.sizeBytes/1048576).toFixed(1) + ' MB'
      : Math.round((a.sizeBytes||0)/1024) + ' KB';
    var ext = (a.mimeType||'').split('/').pop().toUpperCase().slice(0,4) || '—';
    var attId   = esc(String(a.id));
    var attName = esc(String(a.displayName||a.originalFileName||'bilaga'));
    return '<div class="po-att-row">' +
      '<div class="po-att-icon">' + _poFileIcon(a.mimeType) + '</div>' +
      '<div class="po-att-info">' +
        '<div class="po-att-name" title="' + attName + '">' + attName + '</div>' +
        '<div class="po-att-meta">' + ext + ' · ' + sizeLbl + '</div>' +
      '</div>' +
      '<div class="po-att-actions">' +
        '<button type="button" class="po-att-btn" data-attachment-id="' + attId + '" onclick="viewAttachment(this.dataset.attachmentId)">Visa</button>' +
        '<button type="button" class="po-att-btn" data-attachment-id="' + attId + '" data-file-name="' + attName + '" onclick="downloadAttachment(this.dataset.attachmentId,this.dataset.fileName)">Ladda ned</button>' +
      '</div>' +
    '</div>';
  }).join('');
  return '<div class="po-card"><div class="po-card-head"><h2>Bilagor (' + _attachments.length + ')</h2></div>' +
    '<div class="po-card-body" style="padding:0 18px;">' + rows + '</div></div>';
}

async function viewAttachment(attachmentId) {
  /* Öppna same-origin laddningssida synkront — undviker about:blank i adressfältet
     och popup-blockering (fönster öppnat i direkt user-event, inte efter await). */
  var loadingUrl = window.location.origin + '/public-offer.html#attachment-loading';
  var win = window.open(loadingUrl, '_blank');
  if (!win) {
    alert('Webbläsaren blockerade visningsfönstret. Tillåt popup-fönster och försök igen.');
    return;
  }
  try {
    var res = await fetch(SUPABASE_URL + '/functions/v1/offer-attachment-url', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: _token, attachmentId: attachmentId, mode: 'view' })
    });
    var data = await res.json();
    if (!res.ok) throw new Error(data.error || String(res.status));
    if (!data.url) throw new Error('Servern returnerade ingen länk');
    win.location.replace(data.url);
  } catch(e) {
    win.location.replace(
      window.location.origin + '/public-offer.html#attachment-error:' + encodeURIComponent(e.message || 'Okänt fel')
    );
  }
}

async function downloadOffer() {
  if (!_token) return;
  var btn = document.getElementById('po-dl-pdf-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Laddar…'; }
  try {
    var res = await fetch(SUPABASE_URL + '/functions/v1/offer-public-pdf?t=' + encodeURIComponent(_token));
    if (!res.ok) {
      var errData = await res.json().catch(function() { return {}; });
      throw new Error(errData.error || String(res.status));
    }
    var blob = await res.blob();
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = _offer ? ('Offert-' + (_offer.id || '') + '.pdf') : 'offert.pdf';
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch(e) {
    alert('Kunde inte ladda ner PDF: ' + e.message);
  } finally {
    if (btn) { btn.disabled = false; btn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:3px"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Ladda ner offert'; }
  }
}

async function downloadAttachment(attachmentId, fileName) {
  try {
    var res = await fetch(SUPABASE_URL + '/functions/v1/offer-attachment-url', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: _token, attachmentId: attachmentId, mode: 'download' })
    });
    var data = await res.json();
    if (!res.ok) throw new Error(data.error || res.status);
    var a = document.createElement('a');
    a.href = data.url;
    a.download = data.fileName || fileName || 'bilaga';
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  } catch(e) {
    alert('Kunde inte ladda ned filen: ' + e.message);
  }
}

/* ── Formulär per åtgärd ─────────────────────────────────── */
function showForm(action) {
  _activeForm = action;
  var area = document.getElementById('po-form-area');
  if (!area) return;

  var prefillName  = (_offer && _offer.contactName)  ? _offer.contactName.replace(/&/g,'&amp;').replace(/"/g,'&quot;')  : '';
  var prefillEmail = (_offer && _offer.contactEmail) ? _offer.contactEmail.replace(/&/g,'&amp;').replace(/"/g,'&quot;') : '';

  if (action === 'approve') {
    area.innerHTML = '<div class="po-form" id="po-form">' +
      '<div class="po-row2"><div class="po-fg"><label>Ditt namn *</label><input id="f-name" type="text" placeholder="För- och efternamn" autocomplete="name" value="' + prefillName + '"></div>' +
      '<div class="po-fg"><label>E-post *</label><input id="f-email" type="email" placeholder="din@email.se" autocomplete="email" value="' + prefillEmail + '"></div></div>' +
      '<div class="po-row2"><div class="po-fg"><label>Telefon</label><input id="f-phone" type="tel" autocomplete="tel"></div>' +
      '<div class="po-fg"><label>Befattning</label><input id="f-position" type="text"></div></div>' +
      '<div class="po-fg"><label>Kommentar (valfri)</label><textarea id="f-comment" rows="2" placeholder="Eventuella kommentarer…"></textarea></div>' +
      '<label class="po-checkbox-row"><input type="checkbox" id="f-agree"> <span>Jag bekräftar att jag tagit del av och godkänner denna offert och dess villkor.</span></label>' +
      '<div id="f-err" class="po-error"></div>' +
      '<div class="po-action-btns"><button class="po-btn submit" onclick="submitForm()">✓ Godkänn och skicka</button><button class="po-btn cancel" onclick="cancelForm()">Avbryt</button></div>' +
    '</div>';
  } else if (action === 'change_request') {
    area.innerHTML = '<div class="po-form" id="po-form">' +
      '<div class="po-row2"><div class="po-fg"><label>Ditt namn *</label><input id="f-name" type="text" autocomplete="name" value="' + prefillName + '"></div>' +
      '<div class="po-fg"><label>E-post *</label><input id="f-email" type="email" autocomplete="email" value="' + prefillEmail + '"></div></div>' +
      '<div class="po-fg"><label>Kategori</label><select id="f-cat">' +
        '<option value="pris">Pris</option><option value="omfattning">Omfattning</option><option value="tidplan">Tidplan</option>' +
        '<option value="villkor">Villkor</option><option value="offertpost">Specifik offertpost</option><option value="annat">Annat</option>' +
      '</select></div>' +
      '<div class="po-fg"><label>Beskriv vad som behöver ändras *</label><textarea id="f-comment" rows="4" placeholder="Ange vad du vill ska ändras…"></textarea></div>' +
      '<div id="f-err" class="po-error"></div>' +
      '<div class="po-action-btns"><button class="po-btn submit" onclick="submitForm()">↩ Skicka ändringsbegäran</button><button class="po-btn cancel" onclick="cancelForm()">Avbryt</button></div>' +
    '</div>';
  } else if (action === 'decline') {
    area.innerHTML = '<div class="po-form" id="po-form">' +
      '<div class="po-row2"><div class="po-fg"><label>Ditt namn *</label><input id="f-name" type="text" autocomplete="name" value="' + prefillName + '"></div>' +
      '<div class="po-fg"><label>E-post *</label><input id="f-email" type="email" autocomplete="email" value="' + prefillEmail + '"></div></div>' +
      '<div class="po-fg"><label>Anledning</label><select id="f-reason">' +
        '<option value="för_dyrt">För dyrt</option><option value="annan_leverantör">Valt annan leverantör</option>' +
        '<option value="genomförs_ej">Projektet genomförs inte</option><option value="tidplan">Tidplanen fungerar inte</option>' +
        '<option value="omfattning">Omfattningen passar inte</option><option value="annat">Annat</option>' +
      '</select></div>' +
      '<div class="po-fg"><label>Kommentar (valfri)</label><textarea id="f-comment" rows="2"></textarea></div>' +
      '<div id="f-err" class="po-error"></div>' +
      '<div class="po-action-btns"><button class="po-btn decline" onclick="submitForm()">✕ Neka offert</button><button class="po-btn cancel" onclick="cancelForm()">Avbryt</button></div>' +
    '</div>';
  }
  var firstInput = area.querySelector('input,textarea,select');
  if (firstInput) setTimeout(function(){ firstInput.focus(); }, 60);
}

function cancelForm() {
  _activeForm = null;
  var area = document.getElementById('po-form-area');
  if (area) area.innerHTML = '';
}

/* ── Skicka svar ─────────────────────────────────────────── */
async function submitForm() {
  var name    = (document.getElementById('f-name')?.value   || '').trim();
  var email   = (document.getElementById('f-email')?.value  || '').trim();
  var comment = (document.getElementById('f-comment')?.value|| '').trim();
  var err     = document.getElementById('f-err');
  if (err) { err.classList.remove('show'); err.textContent = ''; }

  if (!name)  { showErr('Fyll i ditt namn.'); return; }
  if (!email || !email.includes('@')) { showErr('Fyll i en giltig e-postadress.'); return; }
  if (_activeForm === 'approve' && !document.getElementById('f-agree')?.checked) {
    showErr('Du måste bekräfta att du godkänner villkoren.'); return;
  }
  if (_activeForm === 'change_request' && !comment) {
    showErr('Beskriv vad du vill ändra.'); return;
  }

  var body = {
    token:          _token,
    action:         _activeForm,
    offerVersion:   _offer.versionNumber || 1,
    name:           name,
    email:          email,
    comment:        comment,
    agreedToTerms:  _activeForm === 'approve' ? !!document.getElementById('f-agree')?.checked : false,
    changeCategory: _activeForm === 'change_request' ? (document.getElementById('f-cat')?.value || '') : '',
    declineReason:  _activeForm === 'decline'         ? (document.getElementById('f-reason')?.value || '') : '',
    phone:          (document.getElementById('f-phone')?.value    || '').trim(),
    position:       (document.getElementById('f-position')?.value || '').trim()
  };

  var btn = document.querySelector('#po-form .po-btn.submit, #po-form .po-btn.decline');
  if (btn) { btn.disabled = true; btn.textContent = 'Skickar…'; }

  try {
    var res  = await fetch(SUPABASE_URL + '/functions/v1/offer-respond', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify(body)
    });
    var data = await res.json();

    if (!res.ok) {
      var msg = data.error === 'terms_required'    ? 'Du måste bekräfta villkoren.'
              : data.error === 'name_required'     ? 'Fyll i ditt namn.'
              : data.error === 'email_required'    ? 'Fyll i din e-postadress.'
              : data.error === 'already_answered'  ? 'Offerten har redan besvarats.'
              : data.error === 'expired'           ? 'Offertlänken har gått ut.'
              : data.error === 'revoked'           ? 'Offertlänken har återkallats.'
              : data.error === 'version_mismatch'      ? 'Offertversionen har ändrats — ladda om sidan.'
              : data.error === 'snapshot_unavailable' ? 'Offertversionen kunde inte verifieras. Kontakta VIFT Fastighetsservice.'
              : 'Ett fel uppstod. Försök igen.';
      showErr(msg);
      if (btn) { btn.disabled = false; btn.textContent = _activeForm==='decline'?'✕ Neka offert':'Skicka'; }
      return;
    }

    /* Visa bekräftelse */
    var successMsg = _activeForm === 'approve'
      ? '<h3>✓ Offert godkänd!</h3><p>Tack för ditt svar! VIFT Fastighetsservice har mottagit ditt godkännande och återkommer med bekräftelse och nästa steg.</p>'
      : _activeForm === 'change_request'
      ? '<h3>↩ Ändringsbegäran skickad</h3><p>Vi har tagit emot din begäran och återkommer med ett reviderat förslag.</p>'
      : '<h3>Offert nekad</h3><p>Vi har tagit emot ditt svar och noterat att du inte vill gå vidare med denna offert. Tack för att du meddelat oss.</p>';

    var actions = document.getElementById('po-actions');
    if (actions) actions.innerHTML = '<div class="po-success-box">' + successMsg + '</div>';

  } catch(e) {
    showErr('Nätverksfel — kontrollera din anslutning och försök igen.');
    if (btn) { btn.disabled = false; btn.textContent = _activeForm==='decline'?'✕ Neka offert':'Skicka'; }
  }
}

function showErr(msg) {
  var err = document.getElementById('f-err');
  if (err) { err.textContent = msg; err.classList.add('show'); }
}

/* ── Init ────────────────────────────────────────────────── */

/* Bilageladdnings-läge: öppnad av intern CRM-knapp "Visa" via same-origin URL.
   Detekteras FÖRE token-logik så att #attachment-loading aldrig tolkas som offerttoken.
   Vid #attachment-error:msg visas felvy i samma fönster. */
(function() {
  var _h = window.location.hash;
  var _isLoad  = _h === '#attachment-loading';
  var _isErr   = !_isLoad && _h.indexOf('#attachment-error:') === 0;
  if (!_isLoad && !_isErr) return;

  /* Dölj PDF/Print-knappar — inte relevanta för bilagefönstret */
  var _hdrBtns = document.querySelector('.po-header > div:last-child');
  if (_hdrBtns) _hdrBtns.style.display = 'none';
  var _hdrSub = document.querySelector('.po-header-sub');
  if (_hdrSub) _hdrSub.textContent = 'Bilagevisning';

  var _root = document.getElementById('po-root');
  if (_root) {
    if (_isLoad) {
      document.title = 'Laddar bilaga…';
      _root.innerHTML = '<div class="po-loader"><div class="po-spinner"></div><span>Laddar bilaga…</span></div>';
    } else {
      var _errMsg = '';
      try { _errMsg = decodeURIComponent(_h.slice(_h.indexOf(':') + 1)); } catch(_) {}
      var _safeMsg = _errMsg.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      document.title = 'Fel vid öppning';
      _root.innerHTML =
        '<div class="po-loader" style="gap:10px;">' +
          '<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">' +
            '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>' +
          '</svg>' +
          '<span style="font-weight:600;">Kunde inte öppna bilagan</span>' +
          (_safeMsg ? '<span style="font-size:12px;color:var(--mt);">' + _safeMsg + '</span>' : '') +
          '<button onclick="window.close()" style="margin-top:4px;padding:6px 20px;background:#1e5fad;color:#fff;border:none;border-radius:6px;font-size:13px;cursor:pointer;">Stäng</button>' +
        '</div>';
    }
  }

  /* Blockera resten av init-skriptet */
  window._poAttachmentMode = true;
})();

if (!window._poAttachmentMode) {

_token = getToken();

/* Om token kom från URL-parametern (?t=...) — flytta den till
   fragment (#t=...) så att:
   - Token inte skickas till webbservern vid siduppdatering
   - Token inte läcker via Referer-header till externa resurser
   - Sidan fortfarande fungerar vid siduppdatering (fragment bevaras) */
if (_token && window.location.search && window.location.search.includes('t=')) {
  try {
    history.replaceState(
      null, '',
      window.location.pathname + '#t=' + encodeURIComponent(_token)
    );
  } catch(_) {}
}

if (!_token) {
  document.getElementById('po-root').innerHTML =
    '<div class="po-status-banner error">Ogiltig länk — ingen offerttoken hittades.</div>';
} else {
  loadOffer(_token);
}

} /* end !_poAttachmentMode */
</script>
